plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "mineclient-bridge-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
}

repositories.configureEach {
    if (it instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository
            && it.url.host == 'maven.neoforged.net') {
        content {
            includeGroupByRegex 'net\\.(neoforged|minecraftforge)(\\..*)?'
            includeGroupByRegex 'cpw\\.mods(\\..*)?'
        }
    }
}

def realLoaderTests = providers.gradleProperty('bridge.realLoaderTests').map { it.toBoolean() }.getOrElse(false)

// Direct vanilla API tests require the official FML compile/test bootstrap.
// Their dedicated real-loader run is mandatory delivery evidence; default
// reflection/pure-policy regression remains independent of that classpath.
if (!realLoaderTests) {
    sourceSets.test.java.exclude '**/PlacementVanillaSemanticsTest.java'
    sourceSets.test.java.exclude '**/MovementBudgetLoaderTest.java'
    sourceSets.test.java.exclude '**/NativeLivingObservationLoaderTest.java'
    sourceSets.test.java.exclude '**/TerrainCapabilityLoaderTest.java'
}

neoForge {
    enable {
        version = project.neo_version
        // Official MDG binary pipeline for memory-constrained build hosts; source mode remains default.
        disableRecompilation = providers.gradleProperty('bridge.noRecompile').map { it.toBoolean() }.getOrElse(false)
    }
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    if (realLoaderTests) {
        unitTest {
            enable()
            testedMod = mods.getByName(mod_id)
            loadedMods = [mods.getByName(mod_id)]
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    if (realLoaderTests) {
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    if (!realLoaderTests) {
        testImplementation 'com.google.code.gson:gson:2.11.0'
        testImplementation 'org.apache.logging.log4j:log4j-api:2.24.1'
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_authors            : mod_authors
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.test {
    // Resolve existing Minecraft types for in-memory BridgeServer response tests.
    // No game entrypoint is run; keep the original test logger instead of adding
    // the compile-only game logging backends alongside the test Log4j API.
    if (!realLoaderTests) {
        classpath += configurations.compileClasspath.filter { file ->
            !file.name.startsWith('log4j-core-') && !file.name.startsWith('log4j-slf4j')
        }
    } else {
        // ModDevGradle provides the genuine FML test bootstrap and runtime classpath.
        maxParallelForks = 1
        maxHeapSize = '768m'
    }
    useJUnitPlatform()
    systemProperty 'mineclientBridge.projectDir', project.projectDir.absolutePath
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        into ''
    }
    manifest {
        attributes(
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version)
    }
}

// forgejunitdev is SERVER-side. Apply the identical observation-only production
// mixin through a test-only common config so its actual injection is exercised.
if (realLoaderTests) {
    tasks.named('prepareNeoForgeTestFiles').configure {
        programArguments.addAll('--mixin', 'movement-budget-loader.mixins.json')
    }
}
